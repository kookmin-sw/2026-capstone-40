[project]
name = "webscrapper"
version = "0.1.0"
description = "Periodic stealth web scraper with page list, timestamped storage, and run manifests"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "schedule>=1.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
