[project]
name = "basic-webscrapper"
version = "0.1.0"
description = "A stealth web scraper that captures domain, HTML, assets, and screenshots"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
