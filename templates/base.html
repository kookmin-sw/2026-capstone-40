<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capstone{% if !page_title.is_empty() %} · {{ page_title }}{% endif %}</title>
  <link rel="stylesheet" href="/style.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <div id="shell">
    <header>
      <a class="logo" href="/alerts">Capstone</a>
      <nav>
        <a href="/"        {% if active == "dashboard" %}class="active"{% endif %}>Dashboard</a>
        <a href="/alerts"  {% if active == "alerts"    %}class="active"{% endif %}>Alerts</a>
        <a href="/domains" {% if active == "domains"   %}class="active"{% endif %}>Domains</a>
        <a href="/tracked" {% if active == "tracked"  %}class="active"{% endif %}>Tracked</a>
        <a href="/probe"   {% if active == "probe"     %}class="active"{% endif %}>Probe</a>
      </nav>
    </header>
    <main id="app">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
